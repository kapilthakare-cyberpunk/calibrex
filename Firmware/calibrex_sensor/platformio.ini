; PlatformIO Configuration for Calibrex Sensor Bridge
; Supports Arduino Uno and ESP32

[env:arduino_uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = 
    adafruit/Adafruit TSL2591 Library
    claws/BH1750

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    adafruit/Adafruit TSL2591 Library
    claws/BH1750

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps = 
    adafruit/Adafruit TSL2591 Library
    claws/BH1750
